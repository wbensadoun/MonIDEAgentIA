  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0c0e" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Google Fonts : Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>FuturIA</title>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>
    <script>
      // "ResizeObserver loop completed with undelivered notifications." is a
      // benign browser warning (multiple observers — Phaser's internal scale
      // manager, Monaco, React Flow — resizing in the same frame). It carries
      // no stack trace and breaks nothing, but CRA's dev error overlay
      // (react-error-overlay, bundled ahead of app code) treats any window
      // 'error' event as a crash. This listener must be registered here,
      // before bundle.js loads, so it runs BEFORE the overlay's own listener
      // and can stop the event from reaching it.
      window.addEventListener('error', function (e) {
        if (e.message === 'ResizeObserver loop completed with undelivered notifications.') {
          e.stopImmediatePropagation();
        }
      });
    </script>
    <div id="root"></div>
  </body>
</html>
